<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AI meal planner and grocery budgeting for students in Spain: answer a few questions, get a week of meals and a shopping list priced in whole supermarket packages by code.">
<title>Student Meal Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E5A3A'/%3E%3Cpath d='M7 22c5-9 13-9 18 0' fill='none' stroke='%23F4EDDF' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='15.5' r='3' fill='%23F4EDDF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#F6F1E7; --card:#FFFDF8; --field:#EFE8DA; --ink:#1F1C16; --muted:#6A6356; --line:#E2D9C8;
    --green:#1E5A3A; --green-ink:#174A2F; --green-soft:#E3EEE4; --green-line:#C9DECD; --on-green:#F6F1E7;
    --red:#9A2A2A; --red-soft:#F7E4E0; --red-line:#E8C4BE;
    --amber:#8A5A0B; --amber-soft:#F5E7C4; --amber-card:#F2DFA8; --amber-ink:#B8791A;
    --shadow:0 1px 2px rgba(40,30,10,.05), 0 8px 24px rgba(40,30,10,.06);
    --serif:"Fraunces",Georgia,serif; --sans:"Source Sans 3",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --t-healthy:#2F7D4F; --t-quick:#A8690C; --t-protein:#B4453A; --t-comfort:#9A5B2E; --t-world:#2E6A8A; --t-mediterranean:#1F7A74; --t-batch:#6B4F9A;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper:#1A1814; --card:#24211C; --field:#2F2B24; --ink:#EFE8DA; --muted:#B3AB9C; --line:#3B362E;
    --green:#7FC498; --green-ink:#9FD6B3; --green-soft:#1F3129; --green-line:#2C4A3A; --on-green:#16140F;
    --red:#E68F84; --red-soft:#3B2724; --red-line:#5A332E; --amber:#E0B460; --amber-soft:#3A3020; --amber-card:#4A3B1E; --amber-ink:#E0B460;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --t-healthy:#8FD3A6; --t-quick:#E7B45E; --t-protein:#F09A8F; --t-comfort:#E0A77A; --t-world:#8EC3E0; --t-mediterranean:#7FD0C8; --t-batch:#BFA6EA; } }
  :root[data-theme="dark"] {
    --paper:#1A1814; --card:#24211C; --field:#2F2B24; --ink:#EFE8DA; --muted:#B3AB9C; --line:#3B362E;
    --green:#7FC498; --green-ink:#9FD6B3; --green-soft:#1F3129; --green-line:#2C4A3A; --on-green:#16140F;
    --red:#E68F84; --red-soft:#3B2724; --red-line:#5A332E; --amber:#E0B460; --amber-soft:#3A3020; --amber-card:#4A3B1E; --amber-ink:#E0B460;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --t-healthy:#8FD3A6; --t-quick:#E7B45E; --t-protein:#F09A8F; --t-comfort:#E0A77A; --t-world:#8EC3E0; --t-mediterranean:#7FD0C8; --t-batch:#BFA6EA; }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 var(--sans); min-height:100vh; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--green); outline-offset:2px; border-radius:8px; }
  [hidden] { display:none !important; }
  h1, h2, h3, .serif { font-family:var(--serif); font-weight:600; letter-spacing:-.015em; margin:0; }
  .mono { font-family:var(--mono); }
  .muted { color:var(--muted); }
  .caps { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  svg.i { width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

  /* top bar */
  .top { max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px 6px; }
  .brand { display:flex; align-items:center; gap:10px; border:0; background:none; padding:0; text-align:left; }
  .brand .logo { width:34px; height:34px; border-radius:10px; background:var(--green); display:grid; place-items:center; flex:none; color:var(--on-green); }
  .brand .logo svg { width:20px; height:20px; }
  .brand b { font-family:var(--serif); font-style:italic; font-weight:600; font-size:19px; display:block; line-height:1.1; }
  .brand span { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.06em; }
  .tools { display:flex; align-items:center; gap:8px; }
  .lang { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--card); }
  .lang button { border:0; background:transparent; padding:5px 12px; border-radius:999px; color:var(--muted); font-family:var(--mono); font-size:12.5px; min-height:34px; }
  .lang button.on { background:var(--green); color:var(--on-green); }
  .round { width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; }
  .round svg { width:19px; height:19px; }

  /* buttons */
  .primary { width:100%; border:0; border-radius:999px; background:var(--green); color:var(--on-green); min-height:56px; font-weight:700; font-size:17px; letter-spacing:.01em; box-shadow:0 6px 18px rgba(30,90,58,.25); display:flex; align-items:center; justify-content:center; gap:10px; transition:filter .15s, transform .1s, opacity .15s; }
  .primary:hover { filter:brightness(1.08); } .primary:active { transform:translateY(1px); }
  .primary:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
  .ghost { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:0 18px; min-height:46px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .ghost:hover { border-color:var(--ink); }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:12px; padding:8px 14px; font-weight:600; min-height:42px; display:inline-flex; align-items:center; gap:8px; }
  .btn:hover { border-color:var(--ink); }
  .link { border:0; background:none; color:var(--green-ink); font-weight:600; padding:6px 0; text-decoration:underline; text-underline-offset:3px; }

  /* welcome */
  .welcome { max-width:760px; margin:0 auto; padding:18px 16px 48px; }
  .welcome .kicker { color:var(--muted); }
  .welcome h1 { font-size:42px; line-height:1.02; margin:12px 0 14px; font-style:italic; max-width:14ch; }
  @media (min-width:700px) { .welcome h1 { font-size:64px; } }
  .welcome .lead { color:var(--muted); font-size:18px; max-width:52ch; margin:0 0 22px; }
  .collage { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 24px; }
  @media (min-width:700px) { .collage { grid-template-columns:repeat(6,1fr); } }
  .collage img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:16px; display:block; background:var(--field); }
  .welcome .ctas { display:grid; gap:10px; max-width:420px; }
  .how { display:grid; gap:10px; margin-top:34px; padding-top:22px; border-top:1px solid var(--line); }
  @media (min-width:700px) { .how { grid-template-columns:repeat(3,1fr); } }
  .how > div { display:flex; gap:12px; align-items:flex-start; }
  .how b { display:block; font-family:var(--serif); font-size:18px; } .how span { color:var(--muted); font-size:14px; }
  .badge { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; padding:3px 7px; border-radius:6px; background:var(--field); color:var(--muted); flex:none; margin-top:3px; }
  .badge.ai { background:var(--amber-soft); color:var(--amber); } .badge.code { background:var(--green-soft); color:var(--green-ink); }

  /* wizard */
  .wizard { max-width:560px; margin:0 auto; padding:4px 16px 140px; }
  .progress { display:flex; align-items:center; gap:12px; margin:6px 0 22px; }
  .back { width:40px; height:40px; border-radius:50%; border:0; background:var(--field); display:grid; place-items:center; color:var(--muted); flex:none; }
  .back:hover { color:var(--ink); }
  .back svg { width:18px; height:18px; }
  .track { flex:1; height:6px; border-radius:999px; background:var(--field); overflow:hidden; }
  .track div { height:100%; background:var(--green); border-radius:999px; transition:width .35s ease; }
  .stepno { font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; }
  .q { font-size:34px; line-height:1.08; margin:0 0 8px; }
  @media (min-width:700px) { .q { font-size:40px; } }
  .qsub { color:var(--muted); margin:0 0 26px; font-size:16px; }
  .enter { animation:rise .28s ease; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { .enter { animation:none; } .track div { transition:none; } }
  .bottom { position:fixed; left:0; right:0; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--paper) 70%, transparent); z-index:20; }
  .bottom > div { max-width:528px; margin:0 auto; }

  /* big counter */
  .counter { display:grid; justify-items:center; gap:4px; padding:28px 0 8px; }
  .counter .n { font-family:var(--serif); font-size:96px; line-height:1; color:var(--green); font-weight:600; }
  .counter .u { color:var(--muted); font-family:var(--mono); font-size:13px; }
  .pm { display:flex; gap:22px; justify-content:center; margin-top:18px; }
  .pm button { width:56px; height:56px; border-radius:50%; border:0; font-size:26px; line-height:1; display:grid; place-items:center; }
  .pm .minus { background:var(--field); color:var(--muted); }
  .pm .plus { background:var(--green); color:var(--on-green); }
  .pm button:disabled { opacity:.35; cursor:not-allowed; }

  /* option rows and tiles */
  .rows { display:grid; gap:10px; }
  .opt { display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:1.5px solid var(--line); background:var(--card); border-radius:16px; padding:14px 16px; min-height:64px; transition:border-color .15s, background .15s, transform .1s; }
  .opt:hover { border-color:var(--muted); }
  .opt .ic { width:40px; height:40px; border-radius:50%; background:var(--field); display:grid; place-items:center; flex:none; color:var(--green-ink); }
  .opt b { display:block; font-weight:700; } .opt small { display:block; color:var(--muted); font-size:13.5px; }
  .opt .tick { margin-left:auto; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; flex:none; color:transparent; }
  .opt.on { border-color:var(--green); background:var(--green-soft); }
  .opt.on .ic { background:var(--card); }
  .opt.on .tick { background:var(--green); border-color:var(--green); color:var(--on-green); }
  .opt.no.on { border-color:var(--red); background:var(--red-soft); } .opt.no.on .tick { background:var(--red); border-color:var(--red); }
  .opt:disabled { opacity:.45; cursor:not-allowed; }
  .tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .tile { display:grid; justify-items:center; align-content:center; gap:8px; border:1.5px solid var(--line); background:var(--card); border-radius:18px; padding:18px 10px; min-height:112px; text-align:center; font-weight:600; position:relative; transition:border-color .15s, background .15s; }
  .tile:hover { border-color:var(--muted); }
  .tile .ic { width:44px; height:44px; border-radius:50%; background:var(--field); display:grid; place-items:center; color:var(--green-ink); }
  .tile.on { border-color:var(--green); background:var(--green-soft); } .tile.on .ic { background:var(--card); }
  .tile small { color:var(--muted); font-weight:400; font-size:12.5px; line-height:1.3; }
  .tile:disabled { cursor:not-allowed; opacity:.5; }
  .tile .soon { position:absolute; top:8px; right:8px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; background:var(--field); color:var(--muted); padding:3px 6px; border-radius:6px; }
  .shops { grid-template-columns:repeat(3,1fr); }
  .shops .tile { min-height:120px; padding:14px 6px; }
  .mark { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; color:#fff; font-family:var(--serif); font-weight:600; font-size:22px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:0 16px; min-height:44px; font-weight:600; font-size:15px; display:inline-flex; align-items:center; gap:6px; }
  .chip.on { background:var(--green-soft); border-color:var(--green); color:var(--green-ink); }
  .chip.no.on { background:var(--red-soft); border-color:var(--red); color:var(--red); }
  .label { display:block; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:26px 0 10px; }
  .info { display:flex; gap:12px; align-items:flex-start; background:var(--green-soft); border:1px solid var(--green-line); border-radius:14px; padding:12px 14px; margin-top:18px; }
  .info svg { color:var(--green-ink); margin-top:1px; }
  .info b { display:block; font-size:14.5px; color:var(--green-ink); } .info span { color:var(--muted); font-size:13.5px; }
  .hint { margin-top:14px; text-align:center; font-family:var(--mono); font-size:12.5px; color:var(--muted); }
  .hint.low { color:var(--red); }

  /* budget */
  .money { display:flex; align-items:baseline; justify-content:center; gap:6px; padding-top:18px; }
  .money input { width:2.3ch; border:0; background:transparent; font-family:var(--serif); font-size:88px; font-weight:600; color:var(--green); text-align:right; padding:0; -moz-appearance:textfield; }
  .money input::-webkit-outer-spin-button, .money input::-webkit-inner-spin-button { -webkit-appearance:none; }
  .money input:focus { outline:none; border-bottom:2px solid var(--green); }
  .money span { font-family:var(--serif); font-size:56px; color:var(--green); font-weight:600; }
  .per { text-align:center; color:var(--muted); font-family:var(--mono); font-size:13px; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:var(--green-soft); color:var(--green-ink); border-radius:999px; padding:4px 12px; font-size:13.5px; font-weight:600; }
  .pill svg { width:16px; height:16px; }
  .center { text-align:center; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:999px; background:linear-gradient(to right, var(--green) 0 var(--fill,20%), var(--field) var(--fill,20%) 100%); margin:26px 0 8px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:30px; height:30px; border-radius:50%; background:var(--card); border:2px solid var(--green); box-shadow:var(--shadow); cursor:grab; }
  input[type=range]::-moz-range-thumb { width:28px; height:28px; border-radius:50%; background:var(--card); border:2px solid var(--green); cursor:grab; }
  .ends { display:flex; justify-content:space-between; font-size:13px; }
  .ends b { display:block; font-family:var(--mono); font-weight:500; } .ends span { color:var(--muted); font-size:12px; }

  /* ingredient grid */
  .search { display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:0 14px; min-height:50px; }
  .search input { border:0; background:transparent; width:100%; min-width:0; font-size:16px; }
  .search input:focus { outline:none; } .search:focus-within { border-color:var(--green); }
  .search svg { color:var(--muted); width:18px; height:18px; }
  .picked { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .picked button { border:0; border-radius:999px; padding:4px 10px; font-size:13px; font-weight:600; background:var(--red-soft); color:var(--red); }
  .picked.have button { background:var(--green-soft); color:var(--green-ink); }
  .cat { font-family:var(--serif); font-size:19px; margin:22px 0 10px; }
  .igrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  @media (min-width:520px) { .igrid { grid-template-columns:repeat(4,1fr); } }
  .ing { border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:10px 4px 8px; display:grid; justify-items:center; gap:4px; min-height:78px; font-size:12.5px; font-weight:600; line-height:1.15; text-align:center; }
  .ing .e { font-size:24px; line-height:1; }
  .ing.on { border-color:var(--red); background:var(--red-soft); color:var(--red); }
  .ing.on .e { filter:grayscale(.6); }
  .have .ing.on, .ing.have.on { border-color:var(--green); background:var(--green-soft); color:var(--green-ink); }
  .have .ing.on .e { filter:none; }
  textarea, .text { width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); resize:vertical; }
  textarea:focus, .text:focus { outline:none; border-color:var(--green); }
  .error { color:var(--red); background:var(--red-soft); border:1px solid var(--red-line); border-radius:12px; padding:10px 12px; margin-top:14px; font-size:.95rem; }
  .error:empty { display:none; }

  /* loading */
  .loading { max-width:520px; margin:0 auto; padding:26px 16px 60px; text-align:center; }
  .loading h1 { font-size:38px; line-height:1.08; }
  .loading .qsub { margin:10px auto 0; max-width:34ch; }
  .stack { position:relative; width:220px; height:190px; margin:34px auto 30px; }
  .stack img { position:absolute; inset:0; width:220px; height:165px; object-fit:cover; border-radius:20px; box-shadow:var(--shadow); border:4px solid var(--card); transition:transform .6s ease, opacity .6s ease; }
  .stack img:nth-child(1) { transform:rotate(-7deg) translate(-18px,10px); }
  .stack img:nth-child(2) { transform:rotate(6deg) translate(18px,8px); }
  .stack img:nth-child(3) { transform:rotate(0) translateY(-4px); }
  .steps { list-style:none; margin:0; padding:6px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); }
  .steps li { display:flex; gap:12px; align-items:center; padding:12px 12px; color:var(--muted); }
  .steps li + li { border-top:1px solid var(--line); }
  .steps b { display:block; font-weight:600; } .steps small { font-size:12.5px; }
  .steps li.done, .steps li.active { color:var(--ink); }
  .disc { width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; flex:none; font-size:13px; }
  .done .disc { background:var(--green); border-color:var(--green); color:var(--on-green); }
  .active .disc { border-color:var(--green); border-top-color:transparent; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .active .disc { animation:none; border-top-color:var(--green); } .stack img { transition:none; } }
  .loadmsg { margin-top:16px; font-family:var(--mono); font-size:12px; color:var(--muted); min-height:1.4em; }

  /* results */
  .results { max-width:720px; margin:0 auto; padding:4px 16px 120px; }
  .hero { position:relative; overflow:hidden; border-radius:24px; padding:26px 22px 22px; background:linear-gradient(160deg, var(--amber-soft), var(--green-soft)); margin-bottom:14px; }
  .hero .leaf { position:absolute; color:var(--green); opacity:.16; }
  .hero .caps { color:var(--green-ink); }
  .hero h1 { font-size:46px; line-height:1; margin:8px 0 6px; }
  @media (min-width:700px) { .hero h1 { font-size:60px; } }
  .hero p { margin:0; font-family:var(--serif); font-style:italic; font-size:20px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow); }
  .card + .card, .block + .block { margin-top:14px; }
  .card h2 { font-size:24px; line-height:1.15; margin-bottom:4px; }
  .card .sub { color:var(--muted); margin:0 0 14px; font-size:14.5px; }
  .costrow { display:grid; gap:12px; grid-template-columns:1fr; }
  @media (min-width:440px) { .costrow { grid-template-columns:1.15fr 1fr; } }
  .cost .caps { color:var(--muted); }
  .cost .big { font-family:var(--serif); font-size:42px; line-height:1.05; color:var(--green); margin:6px 0 10px; }
  .cost.over .big { color:var(--red); }
  .vbar { position:relative; height:8px; border-radius:999px; background:var(--field); }
  .vbar div { height:100%; border-radius:999px; background:var(--green); }
  .cost.over .vbar div { background:var(--red); }
  .vbar i { position:absolute; top:-4px; width:2px; height:16px; background:var(--ink); }
  .okline { display:flex; align-items:center; gap:6px; margin-top:10px; font-weight:600; font-size:14px; color:var(--green-ink); }
  .cost.over .okline { color:var(--red); }

  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};

function amount(v, unit) { if (unit === "ud") return `${Math.round(v)}`; if (v >= 1000) { const k = +(v / 1000).toFixed(2); return `${lang === "es" ? String(k).replace(".", ",") : k} ${unit === "g" ? "kg" : "l"}`; } return `${Math.round(v)} ${unit}`; }

function shops() {

  return [...live, ...SOON.filter(([id]) => !live.some(l => l.id === id)).map(([id, name, color]) => ({ id, name, color, available:false }))];

const shopName = id => (shops().find(s => s.id === id) || { name:id }).name;

function suggestedBudget() { return Math.max(5, Math.min(1000, Math.round(mealsCount() * 1.8))); }

const ingById = id => ingredients().find(i => i.id === id);

const shortName = s => s.replace(/\s*\(.*?\)/g, "").trim();
function allowedForDiet(i) {
  const allow = { omnivore:["vegan","vegetarian","fish","meat"], pescatarian:["vegan","vegetarian","fish"], vegetarian:["vegan","vegetarian"], vegan:["vegan"] }[S.diet];
  return (!i.diet || allow.includes(i.diet)) && !(i.allergens || []).some(a => S.allergies.includes(a));

function tilesFor() {
  // Ingredient tiles: grouped ids first, then every other ingredient on its own.
  const grouped = new Set(GROUPS.flatMap(g => g.ids));
  const tiles = GROUPS.filter(g => g.ids.some(ingById)).map(g => ({ key:g.ids[0], ids:g.ids.filter(ingById), label:g[lang], category:ingById(g.ids.find(ingById)).category, emoji:EMOJI[g.ids[0]] }));
  ingredients().filter(i => !grouped.has(i.id)).forEach(i => tiles.push({ key:i.id, ids:[i.id], label:shortName(i[lang]), category:i.category, emoji:EMOJI[i.id] || "🛒" }));

}

  const tiles = tilesFor().filter(tile => !q || tile.label.toLowerCase().includes(q) || tile.ids.some(id => { const i = ingById(id); return i.en.toLowerCase().includes(q) || i.es.toLowerCase().includes(q); }));

  const order = name === "have" ? HAVE_ORDER : AISLES;

function valid(name) {

  if (name === "days") return S.meals.length > 0;
  if (name === "budget") return S.budget > 0 && S.budget <= 1000;

function budgetHint() {

  el.className = "hint" + (low ? " low" : "");

  const input = $("budget"); if (input) input.style.width = `${Math.max(1, String(input.value).length) + 0.1}ch`;
  const slider = $("slider"); if (slider) slider.style.setProperty("--fill", `${Math.round((Math.min(+slider.max, S.budget) - 5) / (+slider.max - 5) * 100)}%`);
  const next = $("nextBtn"); if (next) next.disabled = !valid("budget");

function toggle(list, value) { const i = list.indexOf(value); if (i >= 0) list.splice(i, 1); else list.push(value); }
function pick(value) {
  const name = STEPS[step];
  if (name === "shop") { const s = shops().find(x => x.id === value); if (s && s.available) { S.shop = value; loadOptions(value); } }
  else if (name === "days") toggle(S.meals, value);
  else if (name === "styles") { if (S.styles.includes(value) || S.styles.length < 3) toggle(S.styles, value); }
  else if (name === "diet") S.diet = value;
  else if (name === "portion") S.portion = value;
  else if (name === "protein") S.protein = value;
  else if (name === "equip") toggle(S.equipment, value);
  save(); render();
}
function pickIngredient(key) {
  const name = STEPS[step], list = name === "have" ? S.have : S.disliked, other = name === "have" ? S.disliked : S.have;
  const tile = tilesFor().find(x => x.key === key) || { ids:[key] };
  const on = tile.ids.some(id => list.includes(id));
  tile.ids.forEach(id => { const i = list.indexOf(id); if (on && i >= 0) list.splice(i, 1); if (!on && i < 0) list.push(id); const j = other.indexOf(id); if (!on && j >= 0) other.splice(j, 1); });
  save();
  $("picked").innerHTML = pickedHtml(list); $("igrid").innerHTML = gridHtml(name);
}
function nextStep() {
  const name = STEPS[step]; if (!valid(name)) return;
  readInputs(); save(); errorMsg = "";
  if (editing) { editing = false; view = "results"; tab = "prefs"; render(); scrollTo({ top:0 }); return; }
  if (step === STEPS.length - 1) { generate(); return; }
  step += 1; search = "";
  if (STEPS[step] === "budget" && !S.budgetTouched) S.budget = suggestedBudget();
  render(); scrollTo({ top:0 });
}
function prevStep() {
  readInputs(); save(); errorMsg = "";
  if (editing) { editing = false; view = "results"; tab = "prefs"; render(); return; }
  if (step === 0) { view = "welcome"; render(); return; }
  step -= 1; search = ""; render(); scrollTo({ top:0 });
}
function readInputs() {
  if ($("notes")) S.notes = $("notes").value.slice(0, 300);
  if ($("code")) accessCode = $("code").value;
}

/* ---------- plan request ---------- */
function body() {
  return { budget_eur:+S.budget, people:S.people, days:S.days, meals:["breakfast","lunch","dinner"].filter(m => S.meals.includes(m)), diet:S.diet, allergies:S.allergies,
    disliked:S.disliked, already_have:S.have.filter(id => !S.disliked.includes(id)), language:lang, notes:S.notes, supermarket:S.shop,
    styles:S.styles, portion:S.portion, protein:S.protein, equipment:S.equipment };
}
async function call(path, payload) {
  const response = await fetch(path, { method:"POST", headers:{ "Content-Type":"application/json", "X-Access-Code":accessCode, "X-Payment-Session":paySession }, body:JSON.stringify(payload) });
  const data = await response.json().catch(() => ({}));
  if (response.status === 402 && paySession) { paySession = ""; store.set("smp.pay", ""); throw new Error(t("payExpired")); }
  if (!response.ok) { const e = new Error(typeof data.detail === "string" ? data.detail : (data.detail || []).map(d => d.msg).join(", ") || response.statusText); e.status = response.status; throw e; }
  return data;
}
async function generate() {
  if (loading) return;
  if (!S.shop && options) S.shop = options.supermarkets[0].supermarket;
  if (options && options.payment_required && !paySession && !accessCode) { errorMsg = t("payNeeded"); view = "wizard"; step = STEPS.length - 1; editing = false; render(); return; }
  if (options && options.access_code_required && !options.payment_required && !accessCode) { errorMsg = t("codeNeeded"); view = "wizard"; step = STEPS.length - 1; editing = false; render(); return; }
  lastBody = body(); save();
  loading = { started:Date.now(), timer:null, done:false }; view = "loading"; render(); scrollTo({ top:0 });
  try {
    const data = await call("/api/plan", lastBody);
    loading.done = true; await new Promise(r => setTimeout(r, 450));
    clearInterval(loading.timer); loading = null;
    lastResult = data; view = "results"; tab = "plan"; render(); scrollTo({ top:0 });
  } catch (error) {
    clearInterval(loading.timer); loading = null;
    errorMsg = error.message; view = "wizard"; step = STEPS.length - 1; editing = false; render();
  }
}

function startLoadingTicker() {
  const tick = () => {
    if (!loading || !$("lsteps")) return;
    const s = (Date.now() - loading.started) / 1000;

    <h4>${esc(t("ingredients"))}</h4><ul>${rows}</ul><h4>${esc(t("method"))}</h4><ol>${m.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    <div class="error" id="swapError" role="alert"></div>
    <div class="foot"><span class="note">${esc(t("recipeNote"))}</span><button type="button" class="btn" data-swap="${m.day}_${m.meal}">↻ ${esc(t("swap"))}</button></div></div>`;
  $("sheet").showModal();
}
async function swapMeal(key) {
  if (!lastResult || loading) return;
  const [d, meal] = key.split("_"), btn = document.querySelector(`[data-swap="${key}"]`);
  if (btn) { btn.disabled = true; btn.textContent = t("swapping"); }
  const plan_meals = lastResult.meals.map(m => ({ day:m.day, meal:m.meal, recipe_name:m.recipe_name, servings:m.servings, minutes:m.minutes || 0, tags:m.tags || [],
    ingredients:m.ingredients.map(i => ({ ingredient_id:i.ingredient_id, quantity:i.quantity, unit:i.unit })), steps:m.steps }));
  try {
    const result = await call("/api/swap", { ...lastBody, day:+d, meal, plan_meals });
    // A swap the checks rejected must not wipe the week: keep the plan and say so.
    if (result.status === "invalid_plan" || result.status === "infeasible") throw new Error(t("swapFailed"));
    lastResult = result;
    $("sheet").close(); render(); openRecipe(key);
  } catch (error) {
    if (btn) { btn.disabled = false; btn.textContent = "↻ " + t("swap"); }
    $("swapError").textContent = error.message;
  }
}

/* ---------- render ---------- */
function navHtml(r) {
  const tabs = [["plan","tabPlan","plan"], ...(r.shopping_list && r.shopping_list.length ? [["list","tabList","list"]] : []), ["prefs","tabPrefs","prefs"]];
  return tabs.map(([k, label, ic]) => `<button type="button" class="${tab === k ? "on" : ""}" data-tab="${k}" aria-current="${tab === k}">${icon(ic)}${esc(t(label))}</button>`).join("");
}
function render() {
  paintChrome();
  const nav = $("nav");
  nav.hidden = view !== "results";
  $("footer").hidden = view === "wizard" || view === "loading";
  if (view === "welcome") $("view").innerHTML = welcomeHtml();
  else if (view === "wizard") { $("view").innerHTML = wizardHtml(); if (STEPS[step] === "budget") budgetHint(); }
  else if (view === "loading") { $("view").innerHTML = loadingHtml(); startLoadingTicker(); }
  else if (view === "results") {
    const r = lastResult;
    if (r.meals && r.meals.length && r.budget) lastAnalysis = analyse(r);
    nav.innerHTML = navHtml(r);
    const inner = tab === "list" && r.shopping_list.length ? listTabHtml(r) : tab === "prefs" ? prefsTabHtml() : planTabHtml(r);
    $("view").innerHTML = `<section class="results ${enter("results" + tab)}">${inner}</section>`;
    if (tab === "plan" && $("reuseMap") && window.ThreadedPantry) {
      const a = lastAnalysis;
      ThreadedPantry.renderBraid($("reuseMap"), a.strands, { days: a.D, labels: true, dayCosts: a.dayCosts, dayWord: t("dayWord"), costWord: t("costByDay"), scale: innerWidth < 600 ? 0.8 : 1, formatMoney: v => money(Math.round(v * 100)) });
    }
    if (tab === "list") wireList(r);
  }
}
function wireList(r) {
  $("copy").onclick = async () => { try { await navigator.clipboard.writeText(shoppingListText(r)); $("copy").textContent = "✓ " + t("copied"); setTimeout(() => { if ($("copy")) $("copy").textContent = "⧉ " + t("copy"); }, 1500); } catch {} };
  $("download").onclick = () => {
    const url = URL.createObjectURL(new Blob([shoppingListText(r)], { type: "text/plain;charset=utf-8" })), a = document.createElement("a");
    a.href = url; a.download = `shopping-list-${new Date().toISOString().slice(0, 10)}.txt`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
}

/* ---------- actions ---------- */
function act(code) {
  const [key, value] = code.split(/:(.*)/);
  if (key === "days") S.days = +value;
  if (key === "budget") { S.budget = Math.round(+value) / 100; S.budgetTouched = true; }
  if (key === "one") { S.people = 1; S.days = +value; }
  if (key === "home" || key === "next") value.split(",").forEach(id => { if (!S.have.includes(id)) S.have.push(id); });
  if (key === "shop") { S.shop = value; loadOptions(value); }
  if (key === "focus") { editing = true; view = "wizard"; step = STEPS.indexOf("have"); save(); render(); scrollTo({ top:0 }); return; }
  save(); generate();
}
document.addEventListener("click", e => {
  if (e.target === $("sheet")) { $("sheet").close(); return; }
  const el = e.target.closest("[data-go],[data-pick],[data-count],[data-allergy],[data-ing],[data-lang],[data-tab],[data-open],[data-swap],[data-close],[data-act],[data-edit]");
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (d.lang) { lang = d.lang; store.set("smp.lang", lang); render(); return; }
  if (d.go === "home") { if (view !== "loading") { view = lastResult ? "results" : "welcome"; editing = false; render(); } return; }
  if (d.go === "start") { view = "wizard"; step = 0; editing = false; render(); scrollTo({ top:0 }); return; }
  if (d.go === "reuse" || d.go === "regen") { generate(); return; }
  if (d.go === "reset") { S = { ...structuredClone(DEFAULTS), shop:S.shop }; save(); lastResult = null; view = "wizard"; step = 0; render(); scrollTo({ top:0 }); return; }
  if (d.go === "pay") { startCheckout(el); return; }
  if (d.go === "next") { nextStep(); return; }
  if (d.go === "back") { prevStep(); return; }
  if (d.pick) { pick(d.pick); return; }
  if (d.count) { const [k, by] = d.count.split(":"); S[k] = Math.max(1, Math.min(limit(k), S[k] + +by)); if (!S.budgetTouched) S.budget = suggestedBudget(); save(); render(); return; }
  if (d.allergy) { toggle(S.allergies, d.allergy); save(); render(); return; }
  if (d.ing) { pickIngredient(d.ing); return; }
  if (d.tab) { tab = d.tab; render(); scrollTo({ top:0 }); return; }
  if (d.open) { openRecipe(d.open); return; }
  if (d.swap) { swapMeal(d.swap); return; }
  if (el.hasAttribute("data-close")) { $("sheet").close(); return; }
  if (d.act) { act(d.act); return; }
  if (d.edit) { editing = true; view = "wizard"; step = +d.edit; search = ""; render(); scrollTo({ top:0 }); }
});
document.addEventListener("input", e => {
  if (e.target.id === "budget" || e.target.id === "slider") {
    const v = Math.max(0, Math.min(1000, Math.round(+e.target.value || 0)));
    S.budget = v; S.budgetTouched = true; save();
    if (e.target.id === "slider" && $("budget")) $("budget").value = v;
    if (e.target.id === "budget" && $("slider")) $("slider").value = Math.min(+$("slider").max, v);
    budgetHint();
  }
  if (e.target.id === "search") { search = e.target.value; $("igrid").innerHTML = gridHtml(STEPS[step]); }
  if (e.target.id === "notes") S.notes = e.target.value.slice(0, 300);
  if (e.target.id === "code") accessCode = e.target.value;
});
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.check && lastResult) {
    const set = checkedSet(lastResult); e.target.checked ? set.add(e.target.dataset.check) : set.delete(e.target.dataset.check);
    store.set("smp.checked", { key:listKey(lastResult), ids:[...set] }); e.target.closest(".li").classList.toggle("done", e.target.checked);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && view === "wizard" && !["TEXTAREA", "BUTTON"].includes(e.target.tagName) && e.target.id !== "search") { e.preventDefault(); nextStep(); }
});
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  store.set("theme", dark ? "light" : "dark"); applyTheme(); if (view === "results") render();
});

/* ---------- payment ---------- */
async function startCheckout(button) {
  readInputs(); save(); errorMsg = "";
  button.disabled = true; button.textContent = t("payGoing");
  try { location.href = (await call("/api/checkout", {})).url; }  // answers are saved: they are still there when Stripe sends the person back
  catch (error) { errorMsg = error.message; render(); }
}
function returnFromCheckout() {
  // Stripe sends the person back to /?session_id=cs_... (paid) or /?checkout=cancelled.
  const params = new URLSearchParams(location.search);
  if (!params.has("session_id") && !params.has("checkout")) return;
  if (params.get("session_id")) { paySession = params.get("session_id"); store.set("smp.pay", paySession); }
  else errorMsg = t("payCancelled");
  history.replaceState(null, "", location.pathname);
  view = "wizard"; step = STEPS.length - 1;
}

/* ---------- start ---------- */
function loadOptions(supermarket) {
  // Package sizes and prices differ per shop, so the ingredient list is reloaded when the shop changes.
  return fetch(`/api/options${supermarket ? `?supermarket=${encodeURIComponent(supermarket)}` : ""}`).then(r => r.json()).then(o => {
    options = o; if (!S.shop && view !== "welcome") S.shop = o.supermarkets[0].supermarket; paintChrome(); if (view === "wizard" && !["budget","dislike","have"].includes(STEPS[step])) render();
  }).catch(() => { errorMsg = t("loadError"); if (view === "wizard") render(); });
}
returnFromCheckout(); applyTheme(); render();
loadOptions(S.shop).then(() => render());
</script>
</body>
